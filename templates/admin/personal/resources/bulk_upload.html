{% extends 'admin/base_site.html' %}
{% block content_title %}{% endblock %}
{% block content %}
<style>
h1.bulk-upload-title {
    font-size: 1rem;
    font-weight: bold;
    margin: 1em 0 .5em 0;
    color: inherit;
}
</style>
<h1 class="bulk-upload-title">Bulk Upload Resources</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <p>
        <label>Category:</label>
        <select name="category">
            {% for value, label in categories %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
    </p>
    <p>
        <label>Files:</label>
        <input type="file" name="files" multiple>
    </p>
    <button type="submit" class="default">Upload All</button>
</form>
{% endblock %}
