{% extends 'base/base.html' %}

{% block content %}

<style>
    .password-reset-success-wrapper {
        min-height: 100vh;
        background-color: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 20px 40px;
    }

    .password-reset-success-card {
        width: 100%;
        max-width: 500px;
        background: var(--surface-alt);
        padding: 50px 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
    }

    .password-reset-success-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 15px;
    }

    .password-reset-success-text {
        font-size: 1.1rem;
        color: var(--text-muted);
    }
</style>

<div class="password-reset-success-wrapper">

    <div class="password-reset-success-card">

        <h1 class="password-reset-success-title">
            Сырсөз жаңыртылды
        </h1>

        <p class="password-reset-success-text">
            Сиздин сырсөзүңүз ийгиликтүү жаңыртылды.
        </p>

    </div>

</div>

{% endblock %}
