{% extends 'base/base.html' %}

{% block content %}

<style>
    .password-reset-success-wrapper {
        min-height: 100vh;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 20px 40px;
    }

    .password-reset-success-card {
        width: 100%;
        max-width: 500px;
        background: #f8f9fc;
        padding: 50px 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
    }

    .password-reset-success-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 15px;
    }

    .password-reset-success-text {
        font-size: 1.1rem;
        color: #4b5563;
    }
</style>

<div class="password-reset-success-wrapper">

    <div class="password-reset-success-card">

        <h1 class="password-reset-success-title">
            Сырсөз жаңыртылды
        </h1>

        <p class="password-reset-success-text">
            Сиздин сырсөзүңүз ийгиликтүү жаңыртылды.
        </p>

    </div>

</div>

{% endblock %}
