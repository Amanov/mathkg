{% extends 'base/base.html' %}

{% block content %}

<style>
    .reset-password-wrapper {
        min-height: 100vh;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 20px 40px;
    }

    .reset-password-card {
        width: 100%;
        max-width: 550px;
        background: #f8f9fc;
        padding: 60px 50px;
        border-radius: 18px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    .reset-password-title {
        text-align: center;
        margin-bottom: 35px;
        font-weight: 700;
        font-size: 2rem;
        color: #1f2937;
    }

    .form-control {
        height: 60px;
        border-radius: 10px;
        font-size: 1.05rem;
        padding: 12px 18px;
    }

    .btn-reset {
        width: 100%;
        min-height: 65px;
        border-radius: 10px;
        font-weight: 600;
        margin-top: 20px;
        font-size: 1.05rem;
        padding: 12px 20px;
        line-height: 1.5;
    }
</style>

<div class="reset-password-wrapper">

    <div class="reset-password-card">

        <h1 class="reset-password-title">
            Сырсөздү калыбына келтирүү
        </h1>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <input 
                    type="email"
                    name="email"
                    id="id_email"
                    class="form-control"
                    placeholder="Электрондук почтаңызды киргизиңиз"
                    required
                >
            </div>

            <button class="btn btn-primary btn-reset" type="submit">
                Калыбына келтирүү шилтемесин жөнөтүү
            </button>

        </form>

    </div>

</div>

{% endblock %}
