{% extends 'base/base.html' %}

{% block content %}

<style>
    .password-change-wrapper {
        min-height: 100vh;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 20px 40px;
    }

    .password-change-card {
        width: 100%;
        max-width: 500px;
        background: #f8f9fc;
        padding: 50px 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .password-change-title {
        text-align: center;
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 25px;
        color: #1f2937;
    }

    .form-control {
        height: 55px;
        border-radius: 10px;
        font-size: 1rem;
        margin-bottom: 12px;
    }

    .btn-change {
        width: 100%;
        height: 55px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        margin-top: 10px;
    }

    .error-text {
        color: #dc2626;
        font-size: 0.9rem;
        margin-bottom: 8px;
    }
</style>

<div class="password-change-wrapper">

    <div class="password-change-card">

        <h1 class="password-change-title">
            Сырсөздү өзгөртүү
        </h1>

        <form method="POST">
            {% csrf_token %}

            <input 
                type="password"
                name="old_password"
                id="id_old_password"
                class="form-control"
                placeholder="Эски сырсөз"
                required
            >

            <input 
                type="password"
                name="new_password1"
                id="id_new_password1"
                class="form-control"
                placeholder="Жаңы сырсөз"
                required
            >

            <input 
                type="password"
                name="new_password2"
                id="id_new_password2"
                class="form-control"
                placeholder="Жаңы сырсөздү кайталаңыз"
                required
            >

            {% for field in form %}
                {% for error in field.errors %}
                    <p class="error-text">{{ error }}</p>
                {% endfor %}
            {% endfor %}

            <button class="btn btn-primary btn-change" type="submit">
                Жаңыртуу
            </button>

        </form>

    </div>

</div>

{% endblock %}
