{% extends 'base/base.html' %}

{% block content %}

<style>
    .password-reset-complete-wrapper {
        min-height: 100vh;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 120px 20px 40px;
    }

    .password-reset-complete-card {
        width: 100%;
        max-width: 520px;
        background: #f8f9fc;
        padding: 50px 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
    }

    .password-reset-complete-text {
        font-size: 1.1rem;
        color: #4b5563;
        line-height: 1.6;
    }

    .password-reset-login-link {
        display: inline-block;
        margin-top: 15px;
        font-weight: 600;
        color: #2268ae;
        text-decoration: none;
    }

    .password-reset-login-link:hover {
        text-decoration: underline;
    }
</style>

<div class="password-reset-complete-wrapper">

    <div class="password-reset-complete-card">

        <p class="password-reset-complete-text">
            Сиздин сырсөзүңүз ийгиликтүү жаңыртылды. Эми аккаунтуңузга кире аласыз.
            <br>
            <a href="{% url 'login' %}" class="password-reset-login-link">
                Кирүү
            </a>
        </p>

    </div>

</div>

{% endblock %}
