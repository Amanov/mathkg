{% extends 'base/base.html' %}
{% load static %}

{% block title %}Жаңы тест{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 600px;">

    <h1 class="mb-4">Жаңы тест түзүү</h1>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Тесттин аталышы</label>
            <input class="form-control" name="title" required autofocus>
        </div>
        <button type="submit" class="btn btn-success">Түзүү</button>
        <a class="btn btn-outline-secondary" href="{% url 'exam_list' %}">Артка</a>
    </form>

</div>
{% endblock %}
