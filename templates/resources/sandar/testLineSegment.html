<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dividing Line Segments in Ratios (Algebraic)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* 3D Flip Card CSS */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .flipped .card-inner {
            transform: rotateY(180deg);
        }
        
        /* Smooth reveal animation */
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        /* Gradient Text */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="h-full flex flex-col p-4 md:p-8">

    <!-- Header & Controls -->
    <header class="max-w-6xl w-full mx-auto flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">Dividing Line Segments by Ratios</h1>
            <p class="text-sm text-slate-500 mt-1">Year 11 (Middle to Higher Tier) • Algebraic Lengths</p>
        </div>
        <div class="flex space-x-3">
            <button onclick="flipAll(false)" class="px-4 py-2 bg-white border border-slate-300 text-slate-600 rounded-lg text-sm font-semibold hover:bg-slate-50 transition-colors shadow-sm">
                Hide All
            </button>
            <button onclick="flipAll(true)" class="px-4 py-2 bg-indigo-600 border border-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 transition-colors shadow-sm">
                Reveal All
            </button>
        </div>
    </header>

    <!-- Worksheet Grid -->
    <main class="flex-1 max-w-6xl w-full mx-auto pb-12">
        <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be injected here by JavaScript -->
        </div>
    </main>

    <script>
        // Worksheet Data: 18 Questions
        // Gradually increasing in difficulty. Q1-Q9 positive, Q10-Q18 include negatives.
        const questions = [
            // Row 1: Simple positive, 2 variables, no constants
            { q: "6x + 8y", r: "1:1", a: "3x + 4y \\quad \\text{and} \\quad 3x + 4y" },
            { q: "15a + 10b", r: "2:3", a: "6a + 4b \\quad \\text{and} \\quad 9a + 6b" },
            { q: "14m + 21n", r: "4:3", a: "8m + 12n \\quad \\text{and} \\quad 6m + 9n" },
            
            // Row 2: Positive, 2 variables, with constants
            { q: "12p + 8q + 20", r: "1:3", a: "3p + 2q + 5 \\quad \\text{and} \\quad 9p + 6q + 15" },
            { q: "20x + 30y + 10", r: "3:2", a: "12x + 18y + 6 \\quad \\text{and} \\quad 8x + 12y + 4" },
            { q: "18c + 27d + 9", r: "4:5", a: "8c + 12d + 4 \\quad \\text{and} \\quad 10c + 15d + 5" },
            
            // Row 3: Larger coefficients, positive
            { q: "24u + 36v + 12", r: "5:7", a: "10u + 15v + 5 \\quad \\text{and} \\quad 14u + 21v + 7" },
            { q: "35x + 14y", r: "2:5", a: "10x + 4y \\quad \\text{and} \\quad 25x + 10y" },
            { q: "40a + 64b + 8", r: "3:5", a: "15a + 24b + 3 \\quad \\text{and} \\quad 25a + 40b + 5" },
            
            // Row 4: Introducing negative terms, no constants
            { q: "10x - 15y", r: "2:3", a: "4x - 6y \\quad \\text{and} \\quad 6x - 9y" },
            { q: "18a - 12b", r: "5:1", a: "15a - 10b \\quad \\text{and} \\quad 3a - 2b" },
            { q: "-14m + 21n", r: "3:4", a: "-6m + 9n \\quad \\text{and} \\quad -8m + 12n" },
            
            // Row 5: Negative terms, with constants
            { q: "16p - 24q + 32", r: "3:5", a: "6p - 9q + 12 \\quad \\text{and} \\quad 10p - 15q + 20" },
            { q: "-20x + 15y - 30", r: "2:3", a: "-8x + 6y - 12 \\quad \\text{and} \\quad -12x + 9y - 18" },
            { q: "27c - 18d - 9", r: "7:2", a: "21c - 14d - 7 \\quad \\text{and} \\quad 6c - 4d - 2" },
            
            // Row 6: Higher Tier (Variable order mix, larger ratio, and fractional coefficients)
            { q: "24 - 12x - 36y", r: "5:7", a: "10 - 5x - 15y \\quad \\text{and} \\quad 14 - 7x - 21y" },
            { q: "-40a - 24b + 16", r: "3:5", a: "-15a - 9b + 6 \\quad \\text{and} \\quad -25a - 15b + 10" },
            { q: "x - y + 2", r: "1:3", a: "\\frac{1}{4}x - \\frac{1}{4}y + \\frac{1}{2} \\quad \\text{and} \\quad \\frac{3}{4}x - \\frac{3}{4}y + \\frac{3}{2}" }
        ];

        // Generate the grid
        const container = document.getElementById('grid-container');

        questions.forEach((item, index) => {
            const cardHTML = `
                <div class="relative perspective-1000 w-full h-40 cursor-pointer group card-wrapper" onclick="this.classList.toggle('flipped')">
                    <div class="card-inner absolute w-full h-full transform-style-3d shadow-sm hover:shadow-md transition-shadow rounded-xl">
                        
                        <!-- Front of Card (Question) -->
                        <div class="card-front absolute w-full h-full bg-white border border-slate-200 rounded-xl p-5 flex flex-col justify-center items-center backface-hidden">
                            <div class="absolute top-3 left-4 text-xs font-bold text-slate-400">Q${index + 1}</div>
                            <div class="text-center space-y-3">
                                <div class="text-sm text-slate-500">Divide the length:</div>
                                <div class="text-xl font-semibold text-slate-800 math-render">$$${item.q}$$</div>
                                <div class="text-sm font-medium px-3 py-1 bg-slate-100 text-slate-600 rounded-full inline-block">
                                    Ratio ${item.r}
                                </div>
                            </div>
                        </div>

                        <!-- Back of Card (Answer) -->
                        <div class="card-back absolute w-full h-full bg-indigo-50 border border-indigo-200 rounded-xl p-5 flex flex-col justify-center items-center backface-hidden rotate-y-180">
                            <div class="absolute top-3 left-4 text-xs font-bold text-indigo-400">Answer Q${index + 1}</div>
                            <div class="text-center w-full">
                                <div class="text-[1.1rem] font-medium text-indigo-700 math-render w-full overflow-x-auto whitespace-nowrap py-2 no-scrollbar">
                                    $$${item.a}$$
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHTML);
        });

        // Toggle all cards
        function flipAll(show) {
            const cards = document.querySelectorAll('.card-wrapper');
            cards.forEach(card => {
                if (show) {
                    card.classList.add('flipped');
                } else {
                    card.classList.remove('flipped');
                }
            });
        }

        // Initialize KaTeX math rendering after the DOM is built
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false}
                ],
                throwOnError : false
            });
        });
    </script>
</body>
</html>
