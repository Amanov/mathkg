{% extends 'base/base.html' %}
{% block title %} КИРУУ {%endblock%}


{% load static %}
{% load crispy_forms_tags %}

{% block content %}

<!--beginning of the Styling-->
<style>
  
  @media (max-width: 600px) {
  body {
    width: 100%; /* Remove any padding that might affect the full width */
    padding: 0;
    margin: 0;
  }
}
.mainshadow{
    box-shadow: 0 0 20px rgb(13, 167, 255);    
}

    
  
.form-signin {
    /* max-width: 600px; */
    padding: 15px;
    /* background-color:rgb(34, 133, 195); */
    position: relative;
    max-width: 600px;
    height: auto;
    
}
.container{
  width: 100%;
}



/* .h3{
  text-align: center;
}  */

/*- Here is from bootstrap-*/
html,
body {
  height: 100%;
}



.form-signin {
  max-width: 600px;
  padding: 15px;
  border-radius: 2%;
}

.form-signin .form-floating:focus-within {
  z-index: 2;
}

.form-signin input[type="email"] {
  margin-bottom: -1px;
  border-bottom-right-radius: 0;
  border-bottom-left-radius: 0;
}

.form-signin input[type="password"] {
  margin-bottom: 10px;
  border-top-left-radius: 0;
  border-top-right-radius: 0;
}

.bd-placeholder-img {
    font-size: 1.125rem;
    text-anchor: middle;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
}


@media (min-width: 768px) {
        .bd-placeholder-img-lg {
          font-size: 3.5rem;
        }
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cal+Sans&display=swap'); 

/* ── Typography best practices ── */
* {
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Form title */
h1, h2, h3 {
  font-family: 'Cal Sans', 'Inter', sans-serif;
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

/* Labels */
label {
  font-size: 0.875rem;   /* 14px */
  font-weight: 500;
  letter-spacing: 0.01em;
  line-height: 1.5;
}

/* Input fields */
input {
  font-size: 0.9375rem;  /* 15px */
  font-weight: 400;
  line-height: 1.5;
}

/* Button text */
#register-btn, #login-btn {
  font-size: 0.9375rem;  /* 15px */
  font-weight: 600;
  letter-spacing: 0.02em;
}

/* Helper text / hints */
.helptext, .form-text {
  font-size: 0.8125rem;  /* 13px */
  font-weight: 400;
  line-height: 1.5;
  color: #64748b;
}

/* Error messages */
.errorlist li {
  font-size: 0.8125rem;  /* 13px */
  font-weight: 500;
}
#login-btn {
  background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  letter-spacing: 0.03em;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 4px 15px rgba(14, 165, 233, 0.35);
}

#login-btn::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.28), transparent);
  transform: skewX(-20deg);
  transition: left 0.55s ease;
}

#login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(14, 165, 233, 0.45);
}

#login-btn:hover::after {
  left: 160%;
}

#login-btn:active {
  transform: translateY(0) scale(0.98);
  opacity: 0.92;
}
/*--End of bootstrap --*/
</style>

<!--END of the Styling-->
<!--beggining of the form-->
<div class="container justify-content-center align-items-center" style="margin-top: 20%;">
  <form class="form-signin m-auto mainshadow" name="login" method="post"  action="{% url 'login' %}" >
    {% csrf_token %}  {{form|crispy}} 
    
    <!-- <p>Do not have an account ? Create one <a href="{% url 'register'%}">here</a></p> -->

    
    <!--<button class="w-100 btn btn-lg btn-success  " type="submit">Вебсайтка кирүү</button>-->
    <button class="w-100 btn btn-lg" type="submit" id="login-btn">Вебсайтка кирүү</button>

    
  </form>
  <div style="margin-bottom: 100px;"></div>
  <div class="d-flex flex-column align-items-center" style="width: 30%; margin-left: 30%; margin-top: 10%; margin-bottom: 10%;"> 
      <a class=" btn btn-lg btn-danger" href="{% url 'password_reset' %}" ><h6>менин сырсөзүмдү кайра коюу</h6></a>
    </div>
</div>

{% if form.errors %}
    <div class="alert alert-danger">
        {{ form.errors }}
    </div>
{% endif %}


{% endblock content %}
