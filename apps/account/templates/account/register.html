/*- Here is from bootstrap-*/
html,
body {
  height: 100%;
}

body {  
  align-items: center;
  padding-top: 40px;
  /* padding-bottom: 40px; */
  /* background-color: #f5f5f5; */
}

.form-signin {
  max-width: 600px;
  padding: 15px;
  border-radius: 2%;

}

.form-signin .form-floating:focus-within {
  z-index: 2;
}

.form-signin input[type="email"] {
  margin-bottom: -1px;
  border-bottom-right-radius: 0;
  border-bottom-left-radius: 0;
}

.form-signin input[type="password"] {
  margin-bottom: 10px;
  border-top-left-radius: 0;
  border-top-right-radius: 0;
}

.bd-placeholder-img {
    font-size: 1.125rem;
    text-anchor: middle;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
}
@media (min-width: 768px) {
    .bd-placeholder-img-lg {
          font-size: 3.5rem;
        }
}
.container{
  width: 100%;
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cal+Sans&display=swap');

/* ── Typography best practices ── */
* {
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Form title */
h1, h2, h3 {
  font-family: 'Cal Sans', 'Inter', sans-serif;
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

/* Labels */
label {
  font-size: 0.875rem;   /* 14px */
  font-weight: 500;
  letter-spacing: 0.01em;
  line-height: 1.5;
}

/* Input fields */
input {
  font-size: 0.9375rem;  /* 15px */
  font-weight: 400;
  line-height: 1.5;
}

/* Button text */
#register-btn, #login-btn {
  font-size: 0.9375rem;  /* 15px */
  font-weight: 600;
  letter-spacing: 0.02em;
}

/* Helper text / hints */
.helptext, .form-text {
  font-size: 0.8125rem;  /* 13px */
  font-weight: 400;
  line-height: 1.5;
  color: #64748b;
}

/* Error messages */
.errorlist li {
  font-size: 0.8125rem;  /* 13px */
  font-weight: 500;
}
#register-btn {
  background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  letter-spacing: 0.03em;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 4px 15px rgba(14, 165, 233, 0.35);
}

#register-btn::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.28), transparent);
  transform: skewX(-20deg);
  transition: left 0.55s ease;
}

#register-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(14, 165, 233, 0.45);
}

#register-btn:hover::after {
  left: 160%;
}

#register-btn:active {
  transform: translateY(0) scale(0.98);
  opacity: 0.92;
}

</style>

<!--END of the Styling-->

<!--Beginning of the form-->
<div class="container justify-content-center align-items-center" style="margin-top: 20%;">      
    <form class="form-signin m-auto mainshadow" name="registration" method="post" action="{% url 'register' %}"> 
        {% csrf_token %}  {{form|crispy}}  
       
        <!-- <button class="w-100 btn btn-lg btn-success text-uppercase" type="submit" >Катталуу</button> -->

        <button class="w-100 btn btn-lg text-uppercase" type="submit" id="register-btn">Катталуу</button>
    </form>
    <div style="margin-bottom: 100px;"></div>
</div>
<!-- Display success message if registration is successful -->
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-success">{{ message }}</div>
    {% endfor %}
{% endif %}


{% endblock content %}
